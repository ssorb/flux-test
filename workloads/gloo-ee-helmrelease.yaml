apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gloo-ee
  namespace: kube-gloo-system
spec:
  interval: 1m
  driftDetection:
    mode: disabled
  chart:
    spec:
      chart: gloo-ee
      version: "1.16.0"
      sourceRef:
        kind: HelmRepository
        name: solo-io
        namespace: flux-system
  values:
    gatewayProxies:
      gateway-proxy:
        resources:
          requests:
            cpu: 100m
          limits:
            cpu: 500m
  install:
    createNamespace: true
  upgrade:
    disableWait: true

